<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Chatbot as persuader versus passive measurement</title><desc id="fd-desc">Chatbot as persuader versus passive measurement. 3 conditions: Arguing chatbot, Neutral chatbot, Static task. Primary outcome: Support moved toward the op-ed position (1-7, recoded so higher means closer to the op-ed), immediate and at 1 week.. Population: US online panel adults who hold a position on government spending (pro or anti); recruit enough anti-spending respondents to be balanced. Re-contact after 7 days.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Chatbot as persuader versus passive measurement</text>
<g>
<rect class="box" x="20" y="135.0" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="157.0">Population</text>
<text x="32" y="175.0">US online panel adults</text>
<text x="32" y="193.0">who hold a position on</text>
<text x="32" y="211.0">government spending</text>
<text x="32" y="229.0">(pro or anti); recruit</text>
</g>
<polygon class="box" points="280,141.0 316,165.0 280,189.0 244,165.0"/>
<path class="edge" d="M220,165.0 L242,165.0"/><text class="cap" x="231.0" y="159.0" text-anchor="middle">randomized</text>
<g id="arm-c_arg" data-text="Chatbot challenges the participant&#x27;s view and argues the op-ed&#x27;s side.">
<rect class="arm" x="360" y="30" width="300" height="78" rx="6"/>
<text x="372" y="52">Arguing chatbot</text>
<text class="cap" x="372" y="70">Chatbot challenges the participant&#x27;s view</text>
<text class="cap" x="372" y="85">and argues the op-ed&#x27;s side.</text>
</g>
<path class="edge" d="M318,165.0 L356,69.0"/>
<g id="arm-c_neu" data-text="Chatbot asks only neutral open questions about the participant&#x27;s views and does not argue.">
<rect class="arm" x="360" y="120" width="300" height="78" rx="6"/>
<text x="372" y="142">Neutral chatbot</text>
<text class="cap" x="372" y="160">Chatbot asks only neutral open questions</text>
<text class="cap" x="372" y="175">about the participant&#x27;s views and does</text>
</g>
<path class="edge" d="M318,165.0 L356,159.0"/>
<g id="arm-c_sta" data-text="Participant completes a written comparison task of equal length with no chatbot.">
<rect class="arm" x="360" y="210" width="300" height="78" rx="6"/>
<text x="372" y="232">Static task</text>
<text class="cap" x="372" y="250">Participant completes a written</text>
<text class="cap" x="372" y="265">comparison task of equal length with no</text>
</g>
<path class="edge" d="M318,165.0 L356,249.0"/>
<g>
<rect class="box" x="700" y="105.0" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="127.0">Primary outcome</text>
<text x="712" y="145.0">Support moved toward the</text>
<text x="712" y="163.0">op-ed position (1-7,</text>
<text x="712" y="181.0">recoded so higher means</text>
<text x="712" y="199.0">closer to the op-ed),</text>
</g>
<path class="edge" d="M660,165.0 L696,165.0"/></svg>