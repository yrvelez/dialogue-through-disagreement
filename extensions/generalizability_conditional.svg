<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Oversampling the anti-spending position and varying topic</title><desc id="fd-desc">Oversampling the anti-spending position and varying topic. 2 conditions: Op-ed + chatbot, Placebo + chatbot. Primary outcome: Support moved toward the op-ed position (1-7 recoded), as in the source study.. Population: US online panel adults, quota-sampled for equal numbers of pro- and anti-spending respondents on the spending topic and equal numbers of pro and anti on the second topic.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Oversampling the anti-spending position and varying topic</text>
<g>
<rect class="box" x="20" y="90.0" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="112.0">Population</text>
<text x="32" y="130.0">US online panel</text>
<text x="32" y="148.0">adults, quota-sampled</text>
<text x="32" y="166.0">for equal numbers of</text>
<text x="32" y="184.0">pro- and anti-spending</text>
</g>
<polygon class="box" points="280,96.0 316,120.0 280,144.0 244,120.0"/>
<path class="edge" d="M220,120.0 L242,120.0"/><text class="cap" x="231.0" y="114.0" text-anchor="middle">randomized</text>
<g id="arm-oped" data-text="Op-ed against own position, then chatbot conversation">
<rect class="arm" x="360" y="30" width="300" height="78" rx="6"/>
<text x="372" y="52">Op-ed + chatbot</text>
<text class="cap" x="372" y="70">Op-ed against own position, then chatbot</text>
<text class="cap" x="372" y="85">conversation</text>
</g>
<path class="edge" d="M318,120.0 L356,69.0"/>
<g id="arm-placebo" data-text="Unrelated placebo article, then chatbot conversation">
<rect class="arm" x="360" y="120" width="300" height="78" rx="6"/>
<text x="372" y="142">Placebo + chatbot</text>
<text class="cap" x="372" y="160">Unrelated placebo article, then chatbot</text>
<text class="cap" x="372" y="175">conversation</text>
</g>
<path class="edge" d="M318,120.0 L356,159.0"/>
<g>
<rect class="box" x="700" y="60.0" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="82.0">Primary outcome</text>
<text x="712" y="100.0">Support moved toward the</text>
<text x="712" y="118.0">op-ed position (1-7</text>
<text x="712" y="136.0">recoded), as in the source</text>
<text x="712" y="154.0">study.</text>
</g>
<path class="edge" d="M660,120.0 L696,120.0"/></svg>