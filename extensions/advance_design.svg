<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Chatbot conversation versus a standard attitude scale as a persuasion measure</title><desc id="fd-desc">Chatbot conversation versus a standard attitude scale as a persuasion measure. 4 conditions: Op-ed + chatbot, Op-ed + filler, Placebo + chatbot, Placebo + filler. Primary outcome: Change in support toward the op-ed position (post minus baseline, 1-7 recoded).. Population: US adults on an online panel, with quotas to oversample anti-spending respondents.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Chatbot conversation versus a standard attitude scale as a persuasion measure</text>
<g>
<rect class="box" x="20" y="172.5" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="194.5">Population</text>
<text x="32" y="212.5">US adults on an online</text>
<text x="32" y="230.5">panel, with quotas to</text>
<text x="32" y="248.5">oversample anti-</text>
<text x="32" y="266.5">spending respondents.</text>
</g>
<polygon class="box" points="280,178.5 316,202.5 280,226.5 244,202.5"/>
<path class="edge" d="M220,202.5 L242,202.5"/><text class="cap" x="231.0" y="196.5" text-anchor="middle">randomized</text>
<g id="arm-c1" data-text="Op-ed against own position, then chatbot conversation">
<rect class="arm" x="360" y="30" width="300" height="78" rx="6"/>
<text x="372" y="52">Op-ed + chatbot</text>
<text class="cap" x="372" y="70">Op-ed against own position, then chatbot</text>
<text class="cap" x="372" y="85">conversation</text>
</g>
<path class="edge" d="M318,202.5 L356,69.0"/>
<g id="arm-c2" data-text="Op-ed against own position, then no-chat filler task">
<rect class="arm" x="360" y="120" width="300" height="78" rx="6"/>
<text x="372" y="142">Op-ed + filler</text>
<text class="cap" x="372" y="160">Op-ed against own position, then no-chat</text>
<text class="cap" x="372" y="175">filler task</text>
</g>
<path class="edge" d="M318,202.5 L356,159.0"/>
<g id="arm-c3" data-text="Unrelated article, then chatbot conversation">
<rect class="arm" x="360" y="210" width="300" height="78" rx="6"/>
<text x="372" y="232">Placebo + chatbot</text>
<text class="cap" x="372" y="250">Unrelated article, then chatbot</text>
<text class="cap" x="372" y="265">conversation</text>
</g>
<path class="edge" d="M318,202.5 L356,249.0"/>
<g id="arm-c4" data-text="Unrelated article, then filler task">
<rect class="arm" x="360" y="300" width="300" height="63" rx="6"/>
<text x="372" y="322">Placebo + filler</text>
<text class="cap" x="372" y="340">Unrelated article, then filler task</text>
</g>
<path class="edge" d="M318,202.5 L356,331.5"/>
<g>
<rect class="box" x="700" y="142.5" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="164.5">Primary outcome</text>
<text x="712" y="182.5">Change in support toward</text>
<text x="712" y="200.5">the op-ed position (post</text>
<text x="712" y="218.5">minus baseline, 1-7</text>
<text x="712" y="236.5">recoded).</text>
</g>
<path class="edge" d="M660,202.5 L696,202.5"/></svg>